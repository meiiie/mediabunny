name: Test

on:
  push:
    branches:
      - ci/node-test-file-paths
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: fixture café

    steps:
      - name: Checkout repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: fixture café

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fixture café/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run npm test

      - name: Run affected Node tests on Windows
        if: runner.os == 'Windows'
        run: >-
          npm test -- --project node
          ac3.test.ts adts-muxer.test.ts annex-b-conversion.test.ts dts.test.ts
          duration-from-metadata.test.ts flac.test.ts frame-rate.test.ts
          isobmff-muxer.test.ts matroska-muxer.test.ts metadata-tags.test.ts
          mpeg-ts-demuxing.test.ts read-mp4.test.ts read-wav.test.ts
          source-lifetime.test.ts target.test.ts url-source.test.ts
